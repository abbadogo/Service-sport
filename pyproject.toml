[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "service-engine"
version = "0.1.0"
description = "Deterministic simulation engine for Sabis (Service), a street game from Kano, Nigeria."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # standard library only

[project.scripts]
service-sim = "service.__main__:main"
service-api = "service.api.server:main"

[tool.setuptools.packages.find]
include = ["service*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501", "E701", "E702"]  # compact developer-only tooling

[tool.mypy]
python_version = "3.11"
files = ["service"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
source = ["service"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<3.0",
    "build>=1.2,<2.0",
    "pip-audit>=2.7,<3.0",
    "coverage>=7.6,<8.0",
]
