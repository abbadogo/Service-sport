name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip install -e .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Test, with coverage (fails below 90%, see pyproject.toml)
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report
      - name: Build package
        run: python -m build
      - name: Audit dependencies
        run: pip-audit -r requirements-dev.lock

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit dependencies (retried, because the npm registry's audit service sometimes errors)
        run: |
          for attempt in 1 2 3; do
            npm audit --audit-level=high && exit 0
            echo "npm audit failed (attempt $attempt of 3)"
            sleep 30
          done
          exit 1
